[project]
name = "aggregator"
version = "0.1.0"
description = ""
authors = ["Andrei Borisevich <andreyborisevichleti@gmail.com>"]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "alembic>=1.15.2",
    "asyncpg>=0.30.0",
    "loguru>=0.7.3",
    "pendulum>=3.1.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.40",
    "telethon>=1.40.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "sqlalchemy-stubs>=0.4",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
exclude = [".venv", "alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
